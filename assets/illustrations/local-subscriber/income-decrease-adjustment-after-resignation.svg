<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">퇴사 후 소득이 줄었을 때 지역보험료 조정 전에 볼 것</title>
  <desc id="desc">실제 소득은 줄었지만 보험료 산정에는 과거 소득 자료가 반영되어 생기는 시차를 보여주는 정보형 일러스트</desc>
  <rect width="1200" height="630" fill="#f7fbff"/>
  <rect x="70" y="70" width="1060" height="490" rx="28" fill="#ffffff" stroke="#d8e2ef" stroke-width="4"/>
  <text x="600" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#123b5d">소득은 줄었는데 보험료는 그대로인 이유</text>
  <g font-family="Arial, sans-serif">
    <text x="175" y="215" font-size="26" font-weight="700" fill="#47657f">실제 소득</text>
    <rect x="175" y="235" width="150" height="90" rx="18" fill="#dff3ee"/>
    <rect x="345" y="235" width="150" height="90" rx="18" fill="#dff3ee"/>
    <rect x="515" y="265" width="150" height="60" rx="18" fill="#f0f4f8"/>
    <rect x="685" y="290" width="150" height="35" rx="16" fill="#f0f4f8"/>
    <rect x="855" y="290" width="150" height="35" rx="16" fill="#f0f4f8"/>
    <text x="250" y="292" text-anchor="middle" font-size="26" font-weight="700" fill="#167761">재직</text>
    <text x="420" y="292" text-anchor="middle" font-size="26" font-weight="700" fill="#167761">재직</text>
    <text x="590" y="305" text-anchor="middle" font-size="24" fill="#8296aa">퇴사</text>
    <text x="760" y="316" text-anchor="middle" font-size="22" fill="#8296aa">감소</text>
    <text x="930" y="316" text-anchor="middle" font-size="22" fill="#8296aa">감소</text>
  </g>
  <path d="M175 360h830" stroke="#d8e2ef" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif">
    <text x="175" y="418" font-size="26" font-weight="700" fill="#47657f">보험료 산정 자료</text>
    <rect x="175" y="438" width="490" height="62" rx="18" fill="#fff1d9" stroke="#f0dcb8" stroke-width="3"/>
    <text x="420" y="478" text-anchor="middle" font-size="27" font-weight="700" fill="#9a6500">전년도 소득이 계속 반영</text>
    <rect x="685" y="438" width="320" height="62" rx="18" fill="#fde4df" stroke="#f3cfc8" stroke-width="3"/>
    <text x="845" y="478" text-anchor="middle" font-size="27" font-weight="700" fill="#a94432">조정 신청 검토 구간</text>
  </g>
  <path d="M590 335v95" stroke="#a94432" stroke-width="6" stroke-dasharray="12 10" stroke-linecap="round"/>
  <circle cx="590" cy="360" r="13" fill="#a94432"/>
  <text x="600" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#123b5d">자료 반영 시차를 먼저 확인한 뒤 조정을 문의합니다</text>
</svg>
