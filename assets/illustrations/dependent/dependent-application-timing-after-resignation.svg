<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">퇴사 후 피부양자 신청 시점과 지역보험료 고지 관계</title>
  <desc id="desc">퇴사일부터 피부양자 신청까지의 시간 흐름과 그 사이 지역보험료 고지가 발생하는 구간을 보여주는 정보형 일러스트</desc>
  <rect width="1200" height="630" fill="#f7fbff"/>
  <rect x="70" y="70" width="1060" height="490" rx="28" fill="#ffffff" stroke="#d8e2ef" stroke-width="4"/>
  <path d="M160 330h880" stroke="#d8e2ef" stroke-width="10" stroke-linecap="round"/>
  <rect x="300" y="300" width="380" height="60" rx="20" fill="#fde4df"/>
  <text x="490" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#a94432">이 구간 지역보험료 고지 발생</text>
  <circle cx="300" cy="330" r="20" fill="#275f90"/>
  <circle cx="680" cy="330" r="20" fill="#167761"/>
  <circle cx="1000" cy="330" r="16" fill="#9eb2c7"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="300" y="270" font-size="30" font-weight="700" fill="#123b5d">퇴사일</text>
    <text x="300" y="392" font-size="25" fill="#47657f">직장 자격 상실</text>
    <text x="680" y="270" font-size="30" font-weight="700" fill="#123b5d">신청일</text>
    <text x="680" y="392" font-size="25" fill="#47657f">피부양자 등재</text>
    <text x="1000" y="278" font-size="26" font-weight="700" fill="#47657f">정산</text>
    <text x="1000" y="388" font-size="24" fill="#47657f">환급·조정</text>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="160" y="440" width="290" height="86" rx="20" fill="#f2f8ff" stroke="#cfe0f3" stroke-width="3"/>
    <text x="305" y="478" text-anchor="middle" font-size="25" font-weight="700" fill="#275f90">자격득실확인서</text>
    <text x="305" y="508" text-anchor="middle" font-size="23" fill="#47657f">상실일 확인</text>
    <rect x="470" y="440" width="290" height="86" rx="20" fill="#dff3ee" stroke="#b6e0d4" stroke-width="3"/>
    <text x="615" y="478" text-anchor="middle" font-size="25" font-weight="700" fill="#167761">가족 재직 증빙</text>
    <text x="615" y="508" text-anchor="middle" font-size="23" fill="#47657f">등재 요건 확인</text>
    <rect x="780" y="440" width="290" height="86" rx="20" fill="#fff1d9" stroke="#f0dcb8" stroke-width="3"/>
    <text x="925" y="478" text-anchor="middle" font-size="25" font-weight="700" fill="#9a6500">고지서 대조</text>
    <text x="925" y="508" text-anchor="middle" font-size="23" fill="#47657f">소급 적용 여부</text>
  </g>
  <text x="600" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#123b5d">신청이 늦어지면 그 사이 고지가 먼저 나갑니다</text>
</svg>
